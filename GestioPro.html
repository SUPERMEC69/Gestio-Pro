const computeStatus=v=>{
  if(!v)return"Programada";
  // Manual overrides (except Programada which we always recalculate)
  if(v.status&&v.status!=="Programada"&&v.status!=="En curs"&&v.status!=="Realitzada"&&v.status!=="Completada")return v.status;
  const d=v.dates?v.dates[0]:v.date;
  if(!d)return v.status||"Programada";
  const now=new Date();
  const today_=now.toISOString().slice(0,10);
  // Past day → Realizada
  if(d<today_)return"Realitzada";
  // Future day → Programada
  if(d>today_)return"Programada";
  // Same day: check time
  const [hh,mm]=(v.time||"00:00").split(":").map(Number);
  const dur=+(v.duration||1);
  const start=new Date(now);start.setHours(hh,mm,0,0);
  const end=new Date(start.getTime()+dur*3600000);
  if(now<start)return"Programada";
  if(now>=start&&now<=end)return"En curs";
  return"Realitzada";
};
const needsConfirmation=v=>{
  if(!v)return false;
  const d=v.dates?v.dates[0]:v.date;
  if(!d)return false;
  // Show warning if computed status is Realitzada but not yet confirmed (no manual close)
  const manual=v.status;
  const auto=computeStatus(v);
  // If auto says Realitzada but user hasn't set a "closed" status yet
  const closedStates=["Realitzada","Completada","Cancel·lada"];
  if(auto==="Realitzada" && !closedStates.includes(manual)){return true;}
  return false;
};

const PhotoManager=({photo,onPhoto,photos=[],onPhotos=null,label="Foto",t,circle=false,multi=false,hint=""})=>{
  const [pos,setPos]=useState({x:0,y:0,scale:1});
  const dragR=useRef(null),pinchR=useRef(null);

  const p=typeof photo==="object"?photo?.pos||{x:0,y:0,scale:1}:pos;
  const sz=circle?110:160;

  const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(f);});
  const onSingle=async e=>{const f=e.target.files?.[0];if(!f)return;onPhoto({src:await readFile(f),pos:{x:0,y:0,scale:1}});e.target.value="";};
  const onMulti=async e=>{const fs=Array.from(e.target.files||[]);if(!fs.length)return;const ds=await Promise.all(fs.map(readFile));onPhotos&&onPhotos(prev=>[...(Array.isArray(prev)?prev:[]),...ds]);e.target.value="";};

  const onTS=e=>{
    if(!src)return;
    if(e.touches.length===1)dragR.current={x0:e.touches[0].clientX-p.x,y0:e.touches[0].clientY-p.y};

  };
  const onTM=e=>{
    if(!src)return;e.preventDefault();
    if(e.touches.length===1&&dragR.current){
      const np={...p,x:e.touches[0].clientX-dragR.current.x0,y:e.touches[0].clientY-dragR.current.y0};
      setPos(np);onPhoto(ph=>typeof ph==="object"&&ph?.src?{...ph,pos:np}:ph);

      const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;
      const ns=Math.min(4,Math.max(0.5,pinchR.current.scale0*(Math.hypot(dx,dy)/pinchR.current.dist)));

                <Ic n="camera" s={36}/>
                <span style={{fontSize:12,fontWeight:600}}>Afegir foto</span>
              </div>}
            {src&&<button onClick={e=>{e.stopPropagation();onPhoto("");setPos({x:0,y:0,scale:1});}}
              style={{position:"absolute",top:6,right:6,zIndex:2,background:"rgba(0,0,0,0.65)",border:"none",borderRadius:20,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#fff"}}>
              <Ic n="x" s={13}/>

            {src&&<div style={{position:"absolute",bottom:6,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,0.55)",borderRadius:20,padding:"3px 10px",fontSize:10,color:"#fff",pointerEvents:"none",whiteSpace:"nowrap"}}>
              Arrossega · Pinça per ajustar
            </div>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>

function useDragOrder(items,setItems){
  const dragId=useRef(null);
  const dragOver=useRef(null);
  const onDragStart=(e,id)=>{dragId.current=id;e.dataTransfer.effectAllowed="move";};
  const onDragOver=(e,id)=>{e.preventDefault();dragOver.current=id;};
  const onDrop=()=>{
    if(dragId.current===null||dragOver.current===null||dragId.current===dragOver.current)return;
    const arr=[...items];
    const from=arr.findIndex(x=>x.id===dragId.current);
    const to=arr.findIndex(x=>x.id===dragOver.current);
    const [moved]=arr.splice(from,1);arr.splice(to,0,moved);
    setItems(arr);dragId.current=null;dragOver.current=null;
  };
  const onTouchStart=(e,id)=>{dragId.current=id;};
  const onTouchMove=(e)=>{
    const touch=e.touches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);
    const row=el?.closest("[data-dragid]");
    if(row)dragOver.current=+row.dataset.dragid;
  };
  const onTouchEnd=()=>onDrop();
  return{onDragStart,onDragOver,onDrop,onTouchStart,onTouchMove,onTouchEnd};
}

                :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:cc}}><Ic n={type==="product"?"package":"tool"} s={22}/></div>}
            </div>
            {/* Info — tap opens edit */}
            <div onClick={e=>{e.stopPropagation();onEdit(p);}} style={{flex:1,minWidth:0,cursor:"pointer"}}>
              {/* Line 1: name · badge · price */}
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {(()=>{
                const c2=clients.find(x=>x.id===p.clientId);
                const dn=p.name||p.title||(type==="service"&&c2?c2.name:null)||(lang==="CA"?"Sense títol":"Sin título");
                return <span style={{fontSize:13,fontWeight:700,color:t.txt,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{dn}</span>;
              })()}
                <span style={{background:cc+"22",color:cc,padding:"2px 7px",borderRadius:8,fontSize:10,fontWeight:700,flexShrink:0,...(t.neon?{boxShadow:`0 0 6px ${cc}55`}:{})}}>{p.category}</span>
                <span style={{fontSize:13,fontWeight:900,color:cc,flexShrink:0,...neonText(t),whiteSpace:"nowrap"}}>{p.price}€/{p.unit}</span>
              </div>
              {/* Line 2: description · unit */}
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                <span style={{fontSize:11,color:t.sub,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.description||" "}</span>
                
              </div>
            </div>
            {/* Delete */}
            <button onClick={e=>{e.stopPropagation();if(confirm(lang==="CA"?"Eliminar?":"Eliminar?"))onDelete(p.id);}} style={{width:36,height:36,borderRadius:10,background:"#ef444415",border:"1px solid #ef444433",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#ef4444",flexShrink:0,...(t.neon?{boxShadow:"0 0 8px #ef444444"}:{})}}>
              <Ic n="trash" s={15}/>
            </button>
          </div>
        );
      })}
      {/* GRID VIEW */}
      {vm==="grid"&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {filtered.map(p=>{
            const photoSrc=getSrc(p.photo);
            const cc=catC[p.category]||"#94a3b8";
            return(
              <div key={p.id} onClick={()=>onEdit(p)} style={{background:t.card,border:`1px solid ${t.brd}`,borderRadius:16,padding:12,cursor:"pointer",textAlign:"center",...neonCard(t)}}>
                <div style={{width:60,height:60,borderRadius:14,overflow:"hidden",background:t.inp,margin:"0 auto 8px",border:`2px solid ${cc}33`,...(t.neon?{boxShadow:`0 0 10px ${cc}33`}:{})}}>
                  {photoSrc?<img src={photoSrc} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                    :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:cc}}><Ic n={type==="product"?"package":"tool"} s={26}/></div>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:t.txt,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(()=>{const c2=clients.find(x=>x.id===p.clientId);return p.name||p.title||(type==="service"&&c2?c2.name:null)||(lang==="CA"?"Sense títol":"Sin título");})()}</div>
                {p.description&&<div style={{fontSize:10,color:t.sub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginTop:2}}>{p.description}</div>}
                <div style={{marginTop:6,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                  <span style={{fontSize:15,fontWeight:900,color:cc,...neonText(t)}}>{p.price}€</span>
                  <span style={{fontSize:10,color:t.sub}}>/{p.unit}</span>
                </div>
                <span style={{display:"inline-block",marginTop:5,background:cc+"22",color:cc,padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:600}}>{p.category}</span>
              </div>
            );
          })}
        </div>
      )}
      {!filtered.length&&(
        <div style={{textAlign:"center",color:t.sub,padding:"40px 0"}}>
          <Ic n={type==="product"?"package":"tool"} s={44}/>
          <div style={{marginTop:10,fontSize:14}}>{lang==="CA"?(type==="product"?"Sense productes":"Sense serveis"):(type==="product"?"Sin productos":"Sin servicios")}</div>
        </div>
      )}
    </div>
  );
};
const DEFAULT_PRICE_HOUR=20;
const VisitForm=({visit,clients,products,services,onSave,onClose,t,preClient,lang})=>{
  const tx=TR[lang]||TR.ES;
  const [clientId,setClientId]=useState(preClient||"");
  const [dates,setDates]=useState(visit?.date?[visit.date]:[today()]);
  const [time,setTime]=useState(visit?.time||(()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');})());
  const [duration,setDuration]=useState(visit?.duration||1);
  const [status,setStatus]=useState(visit?.status||"Programada");
  const [type,setType]=useState(visit?.type||"Visita simple");
  const [priority,setPriority]=useState(visit?.priority||"normal");
  const [priceH,setPriceH]=useState(()=>lsGet("defaultPriceH",DEFAULT_PRICE_HOUR));
  const [description,setDescription]=useState(visit?.description||"");
  const [observations,setObservations]=useState(visit?.observations||"");
  const [sp,setSp]=useState(visit?.products||[]);
  const [ss,setSs]=useState(visit?.services||[]);
  const [pSearch,setPSearch]=useState("");
  const [matOpen,setMatOpen]=useState(!!(visit?.products?.length));
  const [svcOpen,setSvcOpen]=useState(!!(visit?.services?.length));
  const [descOpen,setDescOpen]=useState(!!visit?.description);
  const [obsOpen,setObsOpen]=useState(!!visit?.observations);
  const pwTimer=useRef(null);
  const [tip,setTip]=useState(visit?.tip||0);
  const [calOpen,setCalOpen]=useState(false);
  const [visitPhotos,setVisitPhotos]=useState(visit?.photos||[]);
  const togDate=d=>{
    setDates(prev=>prev.includes(d)?prev.filter(x=>x!==d):[...prev,d].sort());
  };
  const addDateInput=d=>{if(d&&!dates.includes(d))setDates(prev=>[...prev,d].sort());};
  const togP=p=>{const e=sp.find(x=>x.productId===p.id);setSp(e?sp.filter(x=>x.productId!==p.id):[...sp,{productId:p.id,qty:1}]);};
  const togS=sv=>{const e=ss.find(x=>x.serviceId===sv.id);setSs(e?ss.filter(x=>x.serviceId!==sv.id):[...ss,{serviceId:sv.id,qty:1}]);};
  const fp=products.filter(p=>p.name.toLowerCase().includes(pSearch.toLowerCase()));
  const matTotal=sp.reduce((a,x)=>{const p=products.find(pp=>pp.id===x.productId);return a+(p?p.price*x.qty:0);},0);
  const svcTotal=ss.reduce((a,x)=>{const sv=services.find(sv=>sv.id===x.serviceId);return a+(sv?sv.price*x.qty:0);},0);
  const timeTotal=duration*priceH;
  const total=matTotal+svcTotal+timeTotal;
  const handleSave=()=>{
    const mainDate=dates[0]||today();
    const visitData={
      ...(visit||{}),
      clientId:+clientId,
      title:clients.find(c=>c.id===+clientId)?.name||"Visita",
      date:mainDate,
      dates:dates.length>1?dates:[mainDate],
      time,duration,status,type,priority,
      products:sp,services:ss,total,description,observations,
      priceH,tip:+tip||0,
      photos:visitPhotos,
    };
    onSave(visitData);
  };
  const CollapseBtn=({open,onToggle,label,count,color})=>(
    <button onClick={onToggle} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:t.inp,border:`1px solid ${open?t.acc:t.brd}`,borderRadius:open?"12px 12px 0 0":12,padding:"11px 14px",cursor:"pointer",color:t.txt,fontWeight:700,fontSize:13,marginBottom:0,...(open?neonInp(t):{})  }}>
      <span style={{display:"flex",alignItems:"center",gap:8}}>
        {label}
        {count>0&&<span style={{background:color||t.acc,color:"#000",borderRadius:20,padding:"1px 8px",fontSize:11,fontWeight:800}}>{count}</span>}
      </span>
      <span style={{fontSize:11,color:t.sub}}>{open?"▲":"▼"}</span>
    </button>
  );
  const CalGrid=()=>{
    const [calMonth,setCalMonth]=useState(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()};});
    const {y,m}=calMonth;
    const dow=(new Date(y,m,1).getDay()+6)%7;
    const days=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<dow;i++)cells.push(null);
    for(let i=1;i<=days;i++)cells.push(i);
    const pad=n=>String(n).padStart(2,"0");
    const isoD=d=>`${y}-${pad(m+1)}-${pad(d)}`;
    const todayIso=today();
    const cellSz=`calc((100% - 12px) / 7)`;
    return(
      <div style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:"0 0 10px 10px",padding:"6px 8px 8px",marginBottom:14}}>
        {/* Month nav — compact */}

          <button onClick={()=>setCalMonth(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})} style={{background:"none",border:"none",cursor:"pointer",color:t.acc,fontSize:16,padding:"0 6px",lineHeight:1,...neonText(t)}}>‹</button>
          <span style={{fontSize:11,fontWeight:700,color:t.txt}}>{MES[m]} {y}</span>

        </div>
        {/* Day grid — fixed 7 cols, no overflow */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,width:"100%"}}>
          {["Dl","Dm","Dx","Dj","Dv","Ds","Dg"].map(d=>(
            <div key={d} style={{textAlign:"center",fontSize:9,fontWeight:700,color:t.sub,padding:"2px 0"}}>{d}</div>
          ))}
          {cells.map((d,i)=>{
            if(!d)return <div key={"e"+i}/>;
            const iso=isoD(d);
            const sel=dates.includes(iso);
            const isToday=iso===todayIso;
            return(
              <button key={i} onClick={()=>togDate(iso)}
                style={{width:"100%",aspectRatio:"1",borderRadius:5,border:`1.5px solid ${sel?t.acc:isToday?t.acc+"66":"transparent"}`,background:sel?t.acc:isToday?t.acc+"22":"transparent",color:sel?"#000":isToday?t.acc:t.txt,fontSize:11,fontWeight:sel||isToday?800:400,cursor:"pointer",padding:0,display:"flex",alignItems:"center",justifyContent:"center",minWidth:0,...(sel?neonBtn(t):{})  }}>
                {d}
              </button>
            );
          })}
        </div>
        {/* Selected chips */}
        {dates.length>0&&(
          <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6,paddingTop:6,borderTop:`1px solid ${t.brd}44`}}>
            {dates.map(d=>(
              <span key={d} style={{background:t.acc,color:"#000",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",gap:3,...neonBtn(t)}}>
                {fmtD(d)}
                <button onClick={()=>setDates(prev=>prev.filter(x=>x!==d))} style={{background:"none",border:"none",color:"#000",cursor:"pointer",fontSize:13,lineHeight:1,padding:0,fontWeight:900}}>×</button>
              </span>
            ))}
          </div>
        )}
      </div>
    );
  };
  return(
    <div>
      {/* Cliente */}
      <Sel label="Client" value={clientId||""} onChange={v=>setClientId(v?+v:"")} options={[{value:"",label:"Sense client"},...clients.map(c=>({value:c.id,label:c.name}))]} t={t}/>
      {/* Estado + Prioridad + Fecha — una sola línea */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10}}>
        <div>
          <div style={{fontSize:10,fontWeight:600,color:t.sub,marginBottom:4}}>Estado</div>
          <select value={status} onChange={e=>setStatus(e.target.value)}
            style={{width:"100%",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:10,padding:"9px 6px",fontSize:11,color:t.txt,outline:"none",WebkitAppearance:"none",appearance:"none",fontFamily:"inherit",...neonInp(t)}}>
            {["Programada","Confirmada","En curs","Realitzada","Cancel·lada"].map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:600,color:t.sub,marginBottom:4}}>Prioridad</div>
          <select value={priority} onChange={e=>setPriority(e.target.value)}
            style={{width:"100%",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:10,padding:"9px 6px",fontSize:11,color:t.txt,outline:"none",WebkitAppearance:"none",appearance:"none",fontFamily:"inherit",...neonInp(t)}}>
            {["baixa","normal","alta","urgent"].map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:10,fontWeight:600,color:t.sub,marginBottom:4}}>Data</div>
          <button onClick={()=>setCalOpen(o=>!o)}
            style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",background:t.inp,border:`1.5px solid ${calOpen?t.acc:t.brd}`,borderRadius:10,padding:"9px 4px 9px 6px",cursor:"pointer",color:dates.length?t.txt:t.sub,fontWeight:600,fontSize:11,...(calOpen?neonInp(t):{})  }}>
            <span>📅 {dates.length===0?"Data":dates.length===1?fmtD(dates[0]):`${dates.length}d`}</span>
            <span style={{fontSize:9,color:t.sub}}>{calOpen?"▲":"▼"}</span>
          </button>
        </div>
      </div>
      {/* Fechas — popup calendar */}
      <div style={{marginBottom:0,position:"relative"}}>
        <button style={{display:"none"}}/>
        {calOpen&&(
          <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 16px",background:"rgba(0,0,0,0.6)"}} onClick={()=>setCalOpen(false)}>
            <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:320,background:t.card,borderRadius:18,overflow:"hidden",boxShadow:"0 12px 48px rgba(0,0,0,0.5)",...(t.neon?{border:`1px solid ${t.acc}55`,boxShadow:`0 12px 48px ${t.acc}33`}:{})}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px 8px"}}>
                <span style={{fontSize:14,fontWeight:800,color:t.txt}}>📅 Seleccionar dates</span>
                <button onClick={()=>setCalOpen(false)} style={{background:"none",border:"none",cursor:"pointer",color:t.sub,fontSize:22,lineHeight:1,padding:"0 2px"}}>×</button>

                <CalGrid/>

              <div style={{padding:"8px 16px 14px",display:"flex",justifyContent:"flex-end",gap:8}}>
                <button onClick={()=>setDates([])} style={{background:"none",border:`1px solid ${t.brd}`,borderRadius:9,padding:"8px 14px",fontSize:12,fontWeight:600,cursor:"pointer",color:t.sub}}>Netejar</button>
                <button onClick={()=>setCalOpen(false)} style={{background:t.acc,border:"none",borderRadius:9,padding:"8px 20px",fontSize:13,fontWeight:800,cursor:"pointer",color:"#000",...neonBtn(t)}}>
                  OK{dates.length>0?` (${dates.length})`:""}</button>

            </div>
          </div>
        )}
      </div>
      {/* Hora | Dur.h | €/hora | ⭐ — equal grid */}

              style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:9,padding:"9px 4px",fontSize:12,color:t.txt,outline:"none",fontFamily:"inherit",...neonInp(t)}}/>
          </div>
          <div>
            <div style={{fontSize:9,fontWeight:700,color:t.sub,marginBottom:3}}>Dur. h</div>
            <input type="number" min="0.5" step="0.5" value={duration} onFocus={e=>e.target.select()}
              onChange={e=>setDuration(e.target.value===''?'':+e.target.value||0.5)}
              style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:9,padding:"9px 6px",fontSize:12,color:t.txt,outline:"none",WebkitAppearance:"none",appearance:"none",fontFamily:"inherit",...neonInp(t)}}/>
          </div>
          <div>
            <div style={{fontSize:9,fontWeight:700,color:t.acc,marginBottom:3}}>€/hora</div>
            <input type="number" min="0" value={priceH} onFocus={e=>e.target.select()}
              onChange={e=>setPriceH(e.target.value===''?0:+e.target.value)}
              style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.acc}55`,borderRadius:9,padding:"9px 6px",fontSize:12,color:t.acc,fontWeight:800,outline:"none",WebkitAppearance:"none",appearance:"none",fontFamily:"inherit",...neonInp(t)}}/>
          </div>
          <button
            onMouseDown={()=>{pwTimer.current=setTimeout(()=>{lsSet("defaultPriceH",priceH);pwTimer.current=null;},2000);}}
            onMouseUp={()=>{if(pwTimer.current){clearTimeout(pwTimer.current);pwTimer.current=null;}}}
            onTouchStart={()=>{pwTimer.current=setTimeout(()=>{lsSet("defaultPriceH",priceH);pwTimer.current=null;},2000);}}
            onTouchEnd={()=>{if(pwTimer.current){clearTimeout(pwTimer.current);pwTimer.current=null;}}}
            title="Mantén 2s per predefinit"
            style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:9,padding:"9px 10px",cursor:"pointer",color:t.sub,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",...neonInp(t)}}>⭐</button>
        </div>
        <div style={{fontSize:10,color:t.sub,textAlign:"right",marginTop:2}}>{duration}h × {priceH}€ = <strong style={{color:t.acc}}>{fmt(timeTotal)}</strong></div>
      </div>

          <div style={{background:t.inp,border:`1px solid ${t.brd}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"10px"}}>

            <div style={{maxHeight:200,overflowY:"auto",borderRadius:8,border:`1px solid ${t.brd}`}}>

                  <span style={{flex:1,fontSize:13,color:t.txt,fontWeight:sel?700:400}}>{p.name}</span>
                  <span style={{fontSize:11,color:t.sub}}>{p.price}€/{p.unit}</span>
                  {sel&&<input type="number" min="1" value={sel.qty} onClick={e=>e.stopPropagation()} onFocus={e=>{e.stopPropagation();e.target.select();}} onChange={e=>setSp(sp.map(x=>x.productId===p.id?{...x,qty:Math.max(1,+e.target.value||1)}:x))} style={{width:46,background:t.card,border:`1px solid ${t.acc}66`,borderRadius:6,padding:"4px 5px",fontSize:13,fontWeight:700,color:t.acc,textAlign:"center",outline:"none",WebkitAppearance:"none",appearance:"none"}}/>}
                </div>
              );})}
              {fp.length===0&&<div style={{padding:"12px",textAlign:"center",fontSize:12,color:t.sub}}>Sense resultats</div>}
            </div>
            {sp.length>0&&<div style={{marginTop:6,textAlign:"right",fontSize:12,color:t.sub}}>Subtotal materials: <strong style={{color:t.acc}}>{fmt(matTotal)}</strong></div>}
          </div>
        )}
      </div>
      {/* ── Servicios (collapsible) ── */}
      <div style={{marginBottom:14}}>
        <CollapseBtn open={svcOpen} onToggle={()=>setSvcOpen(o=>!o)} label="🔧 Serveis" count={ss.length} color="#c77dff"/>
        {svcOpen&&(
          <div style={{background:t.inp,border:`1px solid ${t.brd}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"10px"}}>
            <div style={{maxHeight:200,overflowY:"auto",borderRadius:8,border:`1px solid ${t.brd}`}}>
              {services.map(sv=>{const sel=ss.find(x=>x.serviceId===sv.id);return(
                <div key={sv.id} onClick={()=>togS(sv)} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 10px",cursor:"pointer",background:sel?t.acc+"18":"transparent",borderBottom:`1px solid ${t.brd}`}}>
                  <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${sel?"#c77dff":t.brd}`,background:sel?"#c77dff":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel&&<Ic n="check" s={11}/>}</div>
                  <span style={{flex:1,fontSize:13,color:t.txt,fontWeight:sel?700:400}}>{sv.name}</span>
                  <span style={{fontSize:11,color:t.sub}}>{sv.price}€/{sv.unit}</span>
                  {sel&&<input type="number" min="1" value={sel.qty||1} onClick={e=>e.stopPropagation()} onFocus={e=>{e.stopPropagation();e.target.select();}} onChange={e=>setSs(ss.map(x=>x.serviceId===sv.id?{...x,qty:Math.max(1,+e.target.value||1)}:x))} style={{width:46,background:t.card,border:`1px solid #c77dff66`,borderRadius:6,padding:"4px 5px",fontSize:13,fontWeight:700,color:"#c77dff",textAlign:"center",outline:"none",WebkitAppearance:"none",appearance:"none"}}/>}

                        {!isSvc&&needsConfirmation(v)&&(

                            <span>⏰</span>
                            <span style={{flex:1,fontSize:11,color:"#f59e0b",fontWeight:600}}>Pendent de tancar</span>
                            <button onClick={e=>{e.stopPropagation();setSelDay(null);onOpenVisit({...v,status:"Realitzada"});}} style={{background:"#10b981",border:"none",borderRadius:7,padding:"4px 8px",fontSize:10,fontWeight:800,cursor:"pointer",color:"#fff"}}>✅ Tancar</button>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:4}}>
                    <button onClick={()=>{setSelDay(null);onNewVisit(selDay);}} style={{background:t.acc,border:"none",borderRadius:11,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#000",display:"flex",alignItems:"center",justifyContent:"center",gap:5,...neonBtn(t)}}><Ic n="plus" s={14}/>Nova visita</button>
                    <button onClick={()=>{setAlarmSheet({date:selDay,time:"09:00",title:""});}} style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:11,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer",color:t.sub,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>🔔 Alarma</button>
                  </div>
                  {labels.length>0&&<div style={{marginTop:10}}>
                    <div style={{fontSize:11,color:t.sub,fontWeight:600,marginBottom:6}}>Etiquetes del dia</div>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {labels.map(l=>{const has=(labelDays[selDay]||[]).includes(l.id);return(
                        <button key={l.id} onClick={()=>{const cur=labelDays[selDay]||[];const next=has?cur.filter(x=>x!==l.id):[...cur,l.id];saveLabelDays({...labelDays,[selDay]:next});}}
                          style={{background:has?l.color+"cc":t.inp,border:`1.5px solid ${has?l.color:t.brd}`,borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer",color:has?"#fff":t.sub}}>
                          {l.name}
                        </button>
                      );})}
                    </div>
                  </div>}
                </>);
              })()}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const PwField=({label,value,onChange,placeholder,t})=>{

  return(
    <div style={{marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:600,color:t.sub,marginBottom:5}}>{label}</div>
      <div style={{position:"relative",display:"flex",alignItems:"center"}}>

          type={show?"text":"password"}

            flex:1,boxSizing:"border-box",background:t.inp,
            border:`1px solid ${t.brd}`,borderRadius:12,

          }}/>

const LoginScreen=({users,setUsers,onLogin,t})=>{
  const [mode,setMode]=useState("login");
  const [un,setUn]=useState("");
  const [pw,setPw]=useState("");
  const [pw2,setPw2]=useState("");
  const [name,setName]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  const tryLogin=()=>{
    if(!un.trim()||!pw.trim()){setErr("Omple tots els camps");return;}
    const q=un.trim().toLowerCase();
    const u=users.find(u=>
      (u.username?.toLowerCase()===q || u.email?.toLowerCase()===q)
      && u.password===pw
    );
    if(u){onLogin(u);setErr("");}
    else setErr("Usuari o contrasenya incorrectes");
  };

  const tryRegister=()=>{
    if(!name.trim()||!un.trim()||!pw.trim()){setErr("Omple tots els camps");return;}
    if(pw!==pw2){setErr("Les contrasenyes no coincideixen");return;}
    if(pw.length<4){setErr("La contrasenya ha de tenir mínim 4 caràcters");return;}
    if(users.find(u=>u.username===un.trim())){setErr("Aquest usuari ja existeix");return;}
    const newUser={id:nextId(users),name:name.trim(),username:un.trim(),password:pw,role:users.length===0?"admin":"worker",photo:"",bio:"",phone:"",email:"",clients:[]};
    setUsers(us=>[...us,newUser]);
    setOk("Compte creat! Ara pots entrar.");
    setErr("");
    setMode("login");
    setUn(un.trim());setPw("");setPw2("");setName("");
  };

  return(
    <div style={{position:"fixed",inset:0,background:t.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,overflowY:"auto"}}>
      {t.neon&&<div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at center, #00ffcc08 0%, transparent 70%)",pointerEvents:"none"}}/>}
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:36,fontWeight:900,color:t.txt,letterSpacing:-2,...neonText(t)}}>GESTIO<span style={{color:t.acc}}>PRO</span></div>
          <div style={{fontSize:13,color:t.sub,marginTop:6}}>Gestió professional</div>
        </div>
        {/* Tab selector */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0,marginBottom:20,background:t.inp,borderRadius:14,padding:4,border:`1px solid ${t.brd}`}}>
          {[["login","Entrar"],["register","Registrar-se"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");setOk("");}}
              style={{background:mode===m?t.acc:"transparent",border:"none",borderRadius:10,padding:"10px 0",fontSize:13,fontWeight:700,cursor:"pointer",color:mode===m?"#000":t.sub,transition:"all 0.2s",...(mode===m?neonBtn(t):{})  }}>
              {l}
            </button>
          ))}
        </div>

        <Card t={t} style={{padding:"20px 20px 16px"}}>
          {ok&&<div style={{background:"#10b98122",border:"1px solid #10b98144",borderRadius:10,padding:"10px 12px",marginBottom:14,fontSize:13,color:"#10b981",textAlign:"center"}}>{ok}</div>}
          {mode==="login"?(
            <>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:t.sub,marginBottom:5}}>Usuari / Correu</div>
                <input type="text" value={un} onChange={e=>setUn(e.target.value)}
                  placeholder="usuari o correu electrònic" autoComplete="username"
                  style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:12,padding:"12px 14px",fontSize:14,color:t.txt,outline:"none",fontFamily:"inherit",...neonInp(t)}}/>
              </div>
              <PwField label="Contrasenya" value={pw} onChange={setPw} t={t}/>
              {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:12,textAlign:"center"}}>{err}</div>}
              <Btn onClick={tryLogin} t={t} full style={{fontSize:15,padding:"13px 0"}}><Ic n="lock" s={17}/>Entrar</Btn>
            </>
          ):(
            <>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:t.sub,marginBottom:5}}>Nom complet *</div>
                <input type="text" value={name} onChange={e=>setName(e.target.value)}
                  onFocus={e=>e.target.select()}
                  placeholder="El teu nom"
                  style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:12,padding:"12px 14px",fontSize:14,color:t.txt,outline:"none",fontFamily:"inherit",...neonInp(t)}}/>
              </div>
              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,fontWeight:600,color:t.sub,marginBottom:5}}>Nom d'usuari *</div>
                <input type="text" value={un} onChange={e=>setUn(e.target.value)}
                  onFocus={e=>e.target.select()}
                  placeholder="nom.usuari"
                  style={{width:"100%",boxSizing:"border-box",background:t.inp,border:`1px solid ${t.brd}`,borderRadius:12,padding:"12px 14px",fontSize:14,color:t.txt,outline:"none",fontFamily:"inherit",...neonInp(t)}}/>
              </div>
              <PwField label="Contrasenya *" value={pw} onChange={setPw} placeholder="mínim 4 caràcters" t={t}/>
              <PwField label="Repeteix la contrasenya *" value={pw2} onChange={setPw2} placeholder="repeteix la contrasenya" t={t}/>
              {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:12,textAlign:"center"}}>{err}</div>}
              <Btn onClick={tryRegister} t={t} full style={{fontSize:15,padding:"13px 0"}}><Ic n="user" s={17}/>Crear compte</Btn>
            </>
          )}
        </Card>
        {mode==="login"&&users.length===0&&(
          <div style={{marginTop:12,textAlign:"center",fontSize:12,color:t.sub}}>
            Primer cop? Fes servir <span style={{color:t.acc,cursor:"pointer",fontWeight:700}} onClick={()=>setMode("register")}>Registrar-se</span>
          </div>
        )}
      </div>
    </div>
  );
};

const UsersPage=({users,setUsers,allClients,lang,t})=>{
  const tx=TR[lang]||TR.ES;
  const [addSheet,setAdd]=useState(false);
  const [editUser,setEdit]=useState(null);
  const [shareSheet,setShare]=useState(null);
  const [nf,setNf]=useState({name:"",username:"",password:"",role:"worker",phone:"",email:"",bio:""});
  const saveNew=()=>{
    if(!nf.name||!nf.username||!nf.password)return;
    setUsers(us=>[...us,{...nf,id:nextId(us),photo:"",clients:[]}]);
    setAdd(false);
    setNf({name:"",username:"",password:"",role:"worker",phone:"",email:"",bio:""});
  };
  const saveEdit=f=>{setUsers(us=>us.map(u=>u.id===f.id?f:u));setEdit(null);};
  const deleteUser=id=>setUsers(us=>us.filter(u=>u.id!==id));
  const transferClients=(fromUser,toUserId,clientIds)=>{
    setUsers(us=>us.map(u=>{
      if(u.id===fromUser.id)return{...u,clients:u.clients.filter(id=>!clientIds.includes(id))};
      if(u.id===toUserId)return{...u,clients:[...new Set([...u.clients,...clientIds])]};
      return u;
    }));
    setShare(null);
  };
  const ShareSheet=({fromUser})=>{
    const [toId,setToId]=useState("");
    const [sel,setSel]=useState([]);
    const myClients=allClients.filter(c=>fromUser.clients.includes(c.id));
    const others=users.filter(u=>u.id!==fromUser.id);
    return(
      <div>
        <Sel label="Transferir a usuari" value={toId} onChange={setToId} options={[{value:"",label:"Selecciona usuari"},...others.map(u=>({value:u.id,label:u.name}))]} t={t}/>
        <div style={{fontSize:12,fontWeight:600,color:t.sub,marginBottom:8}}>Selecciona clientes a transferir</div>
        {myClients.map(c=>(
          <div key={c.id} onClick={()=>setSel(s=>s.includes(c.id)?s.filter(x=>x!==c.id):[...s,c.id])} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:sel.includes(c.id)?t.acc+"22":t.inp,border:`1px solid ${sel.includes(c.id)?t.acc:t.brd}`,borderRadius:10,marginBottom:8,cursor:"pointer"}}>
            <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${sel.includes(c.id)?t.acc:t.brd}`,background:sel.includes(c.id)?t.acc:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel.includes(c.id)&&<Ic n="check" s={12}/>}</div>
            <span style={{fontSize:13,fontWeight:600,color:t.txt}}>{c.name}</span>
          </div>
        ))}
        {!myClients.length&&<div style={{color:t.sub,fontSize:13,padding:"12px 0",textAlign:"center"}}>Sense clients assignats</div>}
        <Btn onClick={()=>toId&&sel.length&&transferClients(fromUser,+toId,sel)} t={t} full style={{marginTop:8}}><Ic n="share" s={16}/>Transferir {sel.length} client(s)</Btn>
      </div>
    );
  };
  return(
    <div style={{padding:"12px 12px 100px"}}>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
        <Btn onClick={()=>setAdd(true)} t={t}><Ic n="plus" s={18}/>Nou usuari</Btn>
      </div>
      {users.map(u=>(
        <Card t={t} key={u.id} style={{marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
            <div style={{width:50,height:50,borderRadius:25,overflow:"hidden",background:t.inp,flexShrink:0,border:`2px solid ${t.acc}44`,...neonCard(t)}}>
              {(typeof u.photo==="object"&&u.photo?.src)?<img src={u.photo.src} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
               :(typeof u.photo==="string"&&u.photo)?<img src={u.photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
               :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,color:t.acc}}>{u.name.charAt(0)}</div>}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:700,color:t.txt}}>{u.name}</div>
              <div style={{fontSize:11,color:t.sub}}>@{u.username} · {u.role==="admin"?"Administrador":"Treballador"}</div>
              <div style={{fontSize:11,color:t.sub}}>{allClients.filter(c=>u.clients.includes(c.id)).length} clientes asignados</div>
            </div>
            <span style={{background:u.role==="admin"?t.acc+"22":"#3b9eff22",color:u.role==="admin"?t.acc:"#3b9eff",padding:"3px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>{u.role==="admin"?"Admin":"Worker"}</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <Btn onClick={()=>setEdit(u)} outline t={t} small><Ic n="edit" s={14}/>Editar</Btn>
            <Btn onClick={()=>setShare(u)} outline t={t} small><Ic n="share" s={14}/>Clients</Btn>
            {u.id!==1&&<Btn onClick={()=>deleteUser(u.id)} danger t={t} small><Ic n="trash" s={14}/>Esborrar</Btn>}
          </div>
        </Card>
      ))}
      <Sheet open={addSheet} onClose={()=>setAdd(false)} title="Nou usuari" t={t} lang={lang} full>
        <Inp label="Nom complet *" value={nf.name} onChange={v=>setNf(p=>({...p,name:v}))} t={t} req/>
        <Inp label="Usuari *" value={nf.username} onChange={v=>setNf(p=>({...p,username:v}))} t={t} req/>
        <Inp label="Contrasenya *" value={nf.password} onChange={v=>setNf(p=>({...p,password:v}))} type="password" t={t} req/>
        <Inp label={tx.phone} value={nf.phone} onChange={v=>setNf(p=>({...p,phone:v}))} t={t}/>
        <Inp label={tx.email} value={nf.email} onChange={v=>setNf(p=>({...p,email:v}))} type="email" t={t}/>
        <Sel label="Rol" value={nf.role} onChange={v=>setNf(p=>({...p,role:v}))} options={[{value:"admin",label:"Administrador"},{value:"worker",label:"Treballador"}]} t={t}/>

      </Sheet>
      <Sheet open={!!editUser} onClose={()=>setEdit(null)} title="Editar usuari" t={t} lang={lang} full>
        {editUser&&<UserProfileSheet user={editUser} onUpdate={saveEdit} onClose={()=>setEdit(null)} lang={lang} t={t}/>}
      </Sheet>
      <Sheet open={!!shareSheet} onClose={()=>setShare(null)} title={`Clientes de ${shareSheet?.name||""}`} t={t} lang={lang} full>
        {shareSheet&&<ShareSheet fromUser={shareSheet}/>}
      </Sheet>
    </div>
  );
};

const DataExport=({clients,visits,products,services,invoices,reports,setClients,setVisits,setProducts,setServices,setInvoices,setReports,setCompany,company,t,lang})=>{
  const [selExp,setSelExp]=useState({clients:true,visits:true,products:true,services:true,invoices:true,reports:true,company:true});
  const [importErr,setImportErr]=useState("");
  const [importOk,setImportOk]=useState("");
  const sections=[
    {key:"clients",label:"👥 Clients"},
    {key:"visits",label:"📅 Visites"},
    {key:"products",label:"📦 Productes"},
    {key:"services",label:"🔧 Serveis"},
    {key:"invoices",label:"🧾 Factures"},
    {key:"reports",label:"📋 Informes"},
    {key:"company",label:"🏢 Empresa"},
  ];
  const doExport=()=>{
    const data={};
    if(selExp.clients)data.clients=clients;
    if(selExp.visits)data.visits=visits;
    if(selExp.products)data.products=products;
    if(selExp.services)data.services=services;
    if(selExp.invoices)data.invoices=invoices;
    if(selExp.reports)data.reports=reports;
    if(selExp.company)data.company=company;
    data._exported=new Date().toISOString();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`gestioPro_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
  };
  const doImport=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.clients&&setClients)setClients(data.clients);
        if(data.visits&&setVisits)setVisits(data.visits);
        if(data.products&&setProducts)setProducts(data.products);
        if(data.services&&setServices)setServices(data.services);
        if(data.invoices&&setInvoices)setInvoices(data.invoices);
        if(data.reports&&setReports)setReports(data.reports);
        if(data.company&&setCompany)setCompany(data.company);
        setImportOk("✅ Dades importades correctament!");
        setImportErr("");
      }catch(err){setImportErr("❌ Fitxer invàlid.");setImportOk("");}
    };
    reader.readAsText(file);
    e.target.value="";
  };
  return(
    <Card t={t} style={{marginTop:14}}>
      <div style={{fontSize:13,fontWeight:800,color:t.txt,marginBottom:14,display:"flex",alignItems:"center",gap:6}}>
        <Ic n="share" s={16}/>Exportar / Importar dades
      </div>
      <div style={{fontSize:11,fontWeight:700,color:t.sub,marginBottom:8}}>Selecciona què vols exportar:</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:10}}>
        {sections.map(({key,label})=>(
          <button key={key} onClick={()=>setSelExp(s=>({...s,[key]:!s[key]}))}
            style={{display:"flex",alignItems:"center",gap:8,background:selExp[key]?t.acc+"22":t.inp,border:`1.5px solid ${selExp[key]?t.acc:t.brd}`,borderRadius:10,padding:"8px 10px",cursor:"pointer",color:selExp[key]?t.acc:t.sub,fontSize:12,fontWeight:600,...(selExp[key]?neonBtn(t):{})}}>
            <div style={{width:16,height:16,borderRadius:4,border:`2px solid ${selExp[key]?t.acc:t.brd}`,background:selExp[key]?t.acc:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {selExp[key]&&<Ic n="check" s={10}/>}
            </div>
            {label}
          </button>
        ))}
      </div>
      <button onClick={()=>setSelExp(s=>{const all=Object.values(s).every(Boolean);return Object.fromEntries(Object.keys(s).map(k=>[k,!all]));})}
        style={{background:"transparent",border:"none",cursor:"pointer",color:t.acc,fontSize:11,fontWeight:700,marginBottom:14,padding:0}}>
        {Object.values(selExp).every(Boolean)?"Desseleccionar tot":"Seleccionar tot"}
      </button>
      <Btn onClick={doExport} t={t} full style={{marginBottom:10}}>
        <Ic n="upload" s={16}/>Exportar i descarregar
      </Btn>
      <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:t.inp,border:`2px dashed ${t.brd}`,borderRadius:12,padding:"13px",cursor:"pointer",color:t.sub,fontSize:13,fontWeight:700,position:"relative",...neonInp(t)}}>
        <Ic n="clipboard" s={18}/>Importar fitxer JSON
        <input type="file" accept=".json" onChange={doImport} style={{position:"absolute",inset:0,opacity:0,cursor:"pointer",width:"100%",height:"100%"}}/>
      </label>
      {importOk&&<div style={{marginTop:8,background:"#10b98122",border:"1px solid #10b98144",borderRadius:10,padding:"8px 12px",fontSize:12,color:"#10b981",textAlign:"center"}}>{importOk}</div>}
      {importErr&&<div style={{marginTop:8,background:"#ef444422",border:"1px solid #ef444444",borderRadius:10,padding:"8px 12px",fontSize:12,color:"#ef4444",textAlign:"center"}}>{importErr}</div>}
      <div style={{marginTop:10,fontSize:11,color:t.sub,textAlign:"center",lineHeight:1.4}}>
        💡 Exporta les dades i importa-les al nou dispositiu
      </div>
    </Card>
  );
};

const shareInvoice=async(inv,client,company,simple=false)=>{
  const html=buildInvoiceHTML(inv,client,company,simple);
  const blob=new Blob([html],{type:"text/html"});
  const file=new File([blob],`Factura_${inv.num||"document"}.html`,{type:"text/html"});
  // Build WhatsApp text
  const lines=(inv.lines||[]).map(l=>`• ${l.desc}: ${Number(l.qty*l.price).toFixed(2)}€`).join("\n");
  const text=[
    `🧾 *${company?.name||"Factura"}*`,
    `👤 ${client?.name||""}`,
    inv.date?`📅 ${inv.date}`:"",
    lines?"\n"+lines:"",
    inv.description?`\n📝 ${inv.description}`:"",
    inv.observations?`\n👁 ${inv.observations}`:"",
    `\n💰 *TOTAL: ${Number(inv.total||0).toFixed(2)} €*`,
    inv.tip>0?`✨ Propina: ${Number(inv.tip).toFixed(2)} €`:"",
    company?.phone?`\n📞 ${company.phone}`:"",
  ].filter(Boolean).join("\n");
  // Try native share with file
  if(navigator.share&&navigator.canShare){
    try{
      if(navigator.canShare({files:[file]})){
        await navigator.share({title:`Factura ${inv.num||""}`,text,files:[file]});return;
      }
    }catch(e){}
  }
  // Fallback: WhatsApp text link
  const phone=client?.whatsapp||client?.phone||"";
  if(phone){
    const wa="https://wa.me/34"+phone.replace(/\D/g,"")+"?text="+encodeURIComponent(text);
    window.open(wa,"_blank");return;
  }
  // Last resort: download HTML
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`Factura_${inv.num||"document"}.html`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
};

const InvoicesPage=({invoices,setInvoices,visits,setVisits,clients,services,setServices,products=[],company,lang,t})=>{
  const [tab,setTab]=useState("visites"); // visites | serveis | factures
  const [sf,setSf]=useState("totes");
  const [allShown,setAllShown]=useState(false);
  const [editing,setEditing]=useState(null);
  const [selectedItem,setSelectedItem]=useState(null);
  const [openInvForm,setOpenInvForm]=useState(false);
  const [waPreview,setWaPreview]=useState(null);
  const [pdfPreview,setPdfPreview]=useState(null);
  const [simplePreview,setSimplePreview]=useState(null); // {inv, client, company}

  // Status helpers
  const statusColor={pendent:"#f59e0b",pagada:"#10b981","cancel·lada":"#ef4444",esborrany:"#3b9eff",process:"#3b9eff"};
  const invStatusColor={pendent:"#f59e0b",pagada:"#10b981","cancel·lada":"#ef4444",esborrany:"#3b9eff"};
  const invStatusLabel={pendent:"Pendent",pagada:"Cobrada","cancel·lada":"Cancel·lada",esborrany:"En procés"};

  // Visits with amount
  const visitItems=visits.filter(v=>v.total>0).map(v=>{
    const c=clients.find(x=>x.id===v.clientId);
    // Cobrada = completada OR manual status Realitzada/Cobrada
    const cobrada=v.status==="completada"||v.status==="Cobrada"||v.status==="pagada";
    const st=cobrada?"pagada":"pendent";
    return{...v,_src:"visita",_displaySt:st,_client:c};
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  // Services with amount
  const svcItems=services.filter(s=>{
    const total=+(s.precio||(s.price*(s.tiempo||s.duration||0))).toFixed(2);
    return total>0;
  }).map(s=>{
    const c=clients.find(x=>x.id===s.clientId);
    const total=+(s.precio||(s.price*(s.tiempo||s.duration||1))).toFixed(2);
    // Cobrat = manual status pagada/completada/Cobrada
    const cobrada=s.status==="completada"||s.status==="pagada"||s.status==="Cobrada";
    const st=cobrada?"pagada":"pendent";
    return{...s,_src:"servei",_displaySt:st,_client:c,_total:total};
  }).sort((a,b)=>(b.fecha||b.date||"").localeCompare(a.fecha||a.date||""));

  // Manual invoices
  const invItems=[...invoices].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  // Filter helpers
  const filterList=(items,statusField)=>items.filter(i=>{
    if(sf==="totes")return true;
    const s=statusField?i[statusField]:i._displaySt;
    if(sf==="pendent")return s==="pendent";
    if(sf==="pagada")return s==="pagada"||s==="cobrada";
    return true;
  });

  const filteredVisits=filterList(visitItems);
  const filteredSvcs=filterList(svcItems);
  const filteredInvs=invItems.filter(i=>sf==="totes"||i.status===sf||(sf==="pagada"&&i.status==="pagada"));

  // Totals for current tab
  const getTotal=(items,stField)=>({
    pend:items.filter(i=>(stField?i[stField]:i._displaySt)==="pendent").reduce((s,i)=>s+(i.total||i._total||0),0),
    cobr:items.filter(i=>(stField?i[stField]:i._displaySt)==="pagada").reduce((s,i)=>s+(i.total||i._total||0),0),
  });
  const vTotals=getTotal(visitItems);
  const sTotals=getTotal(svcItems);
  const iTotals={pend:invoices.filter(i=>i.status==="pendent").reduce((s,i)=>s+(i.total||0),0),cobr:invoices.filter(i=>i.status==="pagada").reduce((s,i)=>s+(i.total||0),0)};

  const markPaid=(item,paid)=>{
    if(item._src==="visita"){
      const newSt=paid?"completada":item.status==="completada"?"Programada":item.status;
      setInvoices? null:null;
      // update visit status via setInvoices - need parent to pass setVisits
    }
  };

  const tabs=[["visites","⏱ Hores treball"],["serveis","🔧 Serveis"],["tot","🧾 Factures"]];
  const filters=[["totes","Totes"],["pendent","Pendent"],["pagada","Cobrada"]];

  const ItemCard=({item,onTogglePaid,onSelect})=>{
    const [shown,setShown]=useState(false);

    const st=item._displaySt||item.status||"pendent";
    const paid=st==="pagada"||st==="completada"||item.status==="completada";
    const col=paid?"#10b981":"#f59e0b";
    const date=item.fecha||item.date||"";
    const title=item.title||item.name||item.num||c?.name||"—";
    return(
      <div style={{background:t.card,border:`1px solid ${col}33`,borderRadius:14,padding:"12px 14px",marginBottom:8,...neonCard(t)}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:10,height:10,borderRadius:5,background:col,flexShrink:0,...(t.neon?{boxShadow:`0 0 8px ${col}`}:{})}}/>
          <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>onSelect&&onSelect(item)}>
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:700,color:t.txt}}>{title}</span>
              <span style={{background:col+"22",color:col,padding:"1px 7px",borderRadius:20,fontSize:10,fontWeight:700}}>{paid?"Cobrada":"Pendent"}</span>

            <span style={{fontSize:15,fontWeight:900,color:col,filter:shown||allShown?"none":"blur(6px)",transition:"filter 0.2s",cursor:"pointer"}} onClick={()=>setShown(s=>!s)}>
              {fmt(total)}
            </span>
            <button onClick={()=>onTogglePaid&&onTogglePaid(item,!paid)}
              style={{background:paid?"#ef444418":"#10b98118",border:`1px solid ${paid?"#ef444433":"#10b98133"}`,borderRadius:10,padding:"5px 9px",cursor:"pointer",color:paid?"#ef4444":"#10b981",fontSize:11,fontWeight:800,whiteSpace:"nowrap"}}>
              {paid?"Reobrir":"✅ Cobrar"}
            </button>
          </div>
        </div>
      </div>
    );
  };


  // "tot" tab combines all items
  const allCombined=[...visitItems,...svcItems].sort((a,b)=>(b.date||b.fecha||"").localeCompare(a.date||a.fecha||""));
  const totTotals={pend:allCombined.filter(i=>i._displaySt==="pendent").reduce((s,i)=>s+(i.total||i._total||0),0),cobr:allCombined.filter(i=>i._displaySt==="pagada").reduce((s,i)=>s+(i.total||i._total||0),0)};
  const filteredAll=allCombined.filter(i=>sf==="totes"||(sf==="pendent"&&i._displaySt==="pendent")||(sf==="pagada"&&i._displaySt==="pagada"));
  const currentList=tab==="visites"?filteredVisits:tab==="serveis"?filteredSvcs:tab==="tot"?filteredAll:filteredInvs;
  const totalPend=(tab==="visites"?vTotals:tab==="serveis"?sTotals:tab==="tot"?totTotals:iTotals).pend;
  const totalCobr=(tab==="visites"?vTotals:tab==="serveis"?sTotals:tab==="tot"?totTotals:iTotals).cobr;

  return(
    <div style={{padding:"12px 12px 100px"}}>
      {/* Tabs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>
        {tabs.map(([k,l])=>(

            style={{background:tab===k?t.acc+"22":t.inp,border:`1.5px solid ${tab===k?t.acc:t.brd}`,borderRadius:12,padding:"9px 4px",fontSize:12,fontWeight:700,cursor:"pointer",color:tab===k?t.acc:t.sub,...(tab===k?neonBtn(t):{})}}>{l}</button>
        ))}
      </div>
      {/* Summary */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <div style={{background:t.card,border:"1px solid #f59e0b44",borderRadius:14,padding:"12px 10px",...neonCard(t)}}>
          <div style={{fontSize:10,color:t.sub,marginBottom:4}}>Pendent</div>
          <div style={{fontSize:16,fontWeight:900,color:"#f59e0b",filter:allShown?"none":"blur(7px)",transition:"filter 0.25s",...(t.neon?{textShadow:"0 0 10px #f59e0b"}:{})}}>{fmt(totalPend)}</div>
        </div>
        <div style={{background:t.card,border:"1px solid #10b98144",borderRadius:14,padding:"12px 10px",...neonCard(t)}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <div style={{fontSize:10,color:t.sub}}>Cobrat</div>
            <button onPointerDown={e=>{e.preventDefault();setAllShown(s=>!s);}} style={{background:allShown?t.acc+"22":t.inp,border:`1px solid ${allShown?t.acc:t.brd}`,borderRadius:8,padding:"3px 8px",cursor:"pointer",color:allShown?t.acc:t.sub,fontSize:12,fontWeight:700}}>{allShown?"👁 Ocultar":"🙈 Mostrar"}</button>
          </div>
          <div style={{fontSize:16,fontWeight:900,color:"#10b981",filter:allShown?"none":"blur(7px)",transition:"filter 0.25s",...(t.neon?{textShadow:"0 0 10px #10b981"}:{})}}>{fmt(totalCobr)}</div>

            ?{totes:filteredSvcs.length,pendent:svcItems.filter(i=>i._displaySt==="pendent").length,pagada:svcItems.filter(i=>i._displaySt==="pagada").length}
            :tab==="tot"
            ?{totes:allCombined.length,pendent:allCombined.filter(i=>i._displaySt==="pendent").length,pagada:allCombined.filter(i=>i._displaySt==="pagada").length}
            :{totes:invItems.length,pendent:invoices.filter(i=>i.status==="pendent").length,pagada:invoices.filter(i=>i.status==="pagada").length};
          return filters.map(([k,l])=>{

              <button key={k} onClick={()=>setSf(k)}

                {l}{cnt>0&&sf!==k?<span style={{marginLeft:4,background:k==="pendent"?"#f59e0b22":"#10b98122",color:k==="pendent"?"#f59e0b":"#10b981",borderRadius:10,padding:"1px 5px",fontSize:10}}>{cnt}</span>:null}

      {(tab==="visites"||tab==="serveis"||tab==="tot")&&currentList.map((item,i)=>(
        <ItemCard key={item.id||i} item={item}

  const PAGES={
    home:<Dashboard clients={clients} visits={visits} products={products} services={services} nav={nav} openVisit={openVisit} openService={()=>setPS({open:true,data:null,type:"service"})} lang={lang} t={t}/>,
    clients:<ClientsPage clients={clients} setClients={setClients} onAdd={()=>setCS({open:true,data:null})} onEdit={c=>setCS({open:true,data:c})} onDelete={id=>setClients(cs=>cs.filter(c=>c.id!==id))} openVisit={openVisit} openService={()=>setPS({open:true,data:null,type:"service"})} visits={visits} lang={lang} t={t}/>,
    products:<ProductsPage items={products} setItems={setProducts} type="product" onAdd={()=>setPS({open:true,data:null,type:"product"})} onEdit={p=>setPS({open:true,data:p,type:"product"})} onDelete={id=>setProducts(ps=>ps.filter(p=>p.id!==id))} openVisit={()=>openVisit()} lang={lang} t={t}/>,
    services:<ProductsPage items={services} setItems={setServices} type="service" onAdd={()=>setPS({open:true,data:null,type:"service"})} onEdit={s=>setPS({open:true,data:s,type:"service"})} onDelete={id=>setServices(ss=>ss.filter(s=>s.id!==id))} openVisit={()=>openVisit()} lang={lang} t={t} clients={clients}/>,
    visits:<VisitsPage visits={visits} clients={clients} products={products} services={services} onAdd={()=>setVS({open:true,data:null,preClient:null})} onEdit={v=>setVS({open:true,data:v,preClient:null})} onDelete={id=>setVisits(vs=>vs.filter(v=>v.id!==id))} lang={lang} t={t}/>,
    calendar:<CalendarPage visits={visits} clients={clients} services={services} onOpenVisit={v=>setCalD(v)} onNewVisit={date=>openVisit(date)} onSaveVisit={v=>{if(v.id)setVisits(vs=>vs.map(x=>x.id===v.id?v:x));else setVisits(vs=>[...vs,{...v,id:Math.max(0,...vs.map(x=>x.id))+1}]);}} lang={lang} t={t}/>,
    reports:<ReportsPage reports={reports} setReports={setReports} visits={visits} clients={clients} products={products} services={services} lang={lang} t={t}/>,
    invoices:<InvoicesPage invoices={invoices} setInvoices={setInvoices} visits={visits} setVisits={setVisits} clients={clients} services={services} setServices={setServices} products={products} company={company} lang={lang} t={t}/>,
    payments:<PaymentsPage visits={visits} setVisits={setVisits} services={services} invoices={invoices} setInvoices={setInvoices} clients={clients} lang={lang} t={t}/>,
    users:<UsersPage users={users} setUsers={setUsers} allClients={clients} lang={lang} t={t}/>,
    settings:<SettingsPage company={company} setCompany={setCompany} tn={tn} setTn={setTn} lang={lang} setLang={setLang} t={t} clients={clients} visits={visits} products={products} services={services} invoices={invoices} reports={reports} setClients={setClients} setVisits={setVisits} setProducts={setProducts} setServices={setServices} setInvoices={setInvoices} setReports={setReports}/>,
  };
  const dock=[{id:"home",icon:"home",label:tx.home,mc:"#ff6bff",bc:"#a50044"},{id:"clients",icon:"users",label:tx.clients,mc:"#00ffcc",bc:"#004d98"},{id:"visits",icon:"clipboard",label:tx.visits,mc:"#ffd700",bc:"#a50044"},{id:"products",icon:"package",label:tx.products,mc:"#3b9eff",bc:"#004d98"},{id:"services",icon:"tool",label:tx.services,mc:"#c77dff",bc:"#004d98"},{id:"calendar",icon:"calendar",label:tx.agenda,mc:"#00ffcc",bc:"#004d98"},{id:"invoices",icon:"filetext",label:"Factures",mc:"#f59e0b",bc:"#a50044"},{id:"settings",icon:"settings",label:tx.settings,mc:"#bb88ff",bc:"#004d98"}];
  const userPhotoSrc=getUserPhoto(currentUser);
  if(!currentUser)return <LoginScreen users={users} setUsers={setUsers} onLogin={setCurrentUser} t={t}/>;
  return(
    <div style={{position:"fixed",inset:0,background:t.bg,fontFamily:"'DM Sans',system-ui,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden",userSelect:"none"}}>
      {/* NEON / theme background effects */}
      {t.name==="barca"&&<>
        <div style={{position:"absolute",inset:0,background:"repeating-linear-gradient(45deg,#a5004412 0px,#a5004412 18px,#004d9812 18px,#004d9812 36px)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 20% 0%,#a5004428 0%,transparent 50%)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 100%,#004d9824 0%,transparent 50%)",pointerEvents:"none",zIndex:0}}/>
      </>}
      {t.name==="gold"&&<>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% -10%, #ffd70018 0%, #ffaa0008 40%, transparent 70%)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 20% 100%, #ffd70010 0%, transparent 50%)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 80% 50%, #ff880008 0%, transparent 40%)",pointerEvents:"none",zIndex:0}}/>
      </>}
      {t.name==="multi"&&<>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 10% 0%, #ff6bff0c 0%, transparent 45%)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 90% 30%, #00ffcc0a 0%, transparent 45%)",pointerEvents:"none",zIndex:0}}/>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 100%, #ffd7000a 0%, transparent 50%)",pointerEvents:"none",zIndex:0}}/>
      </>}
      {t.name==="neon"&&<div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 0%, #00ffcc0a 0%, transparent 60%)",pointerEvents:"none",zIndex:0}}/>}
      {t.name==="barca"&&<div style={{position:"absolute",inset:0,background:"repeating-linear-gradient(90deg,#a5004408 0px,#a5004408 20px,#004d9808 20px,#004d9808 40px)",pointerEvents:"none",zIndex:0}}/>}
      {/* HEADER */}
      <div style={{background:t.name==="multi"?"linear-gradient(135deg,#08051e,#0d0820)":t.name==="gold"?"#0a0700":t.name==="barca"?"linear-gradient(90deg,#1a0030 0%,#0a0050 50%,#150020 100%)":t.card,borderBottom:t.name==="multi"?`2px solid transparent`:`1px solid ${t.brd}`,padding:"10px 12px",display:"flex",alignItems:"center",gap:10,flexShrink:0,zIndex:30,...(t.neon?{boxShadow:t.name==="gold"?`0 2px 30px #ffd70044, 0 4px 60px #ffaa0022`:t.name==="multi"?`0 2px 20px ${t.acc}33, 0 2px 20px ${t.acc2}22`:`0 2px 20px ${t.acc}22`}:{})}}>
        {page!=="home"
          ?<button onClick={goBack} style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:11,padding:"9px 11px",cursor:"pointer",color:t.txt,display:"flex",alignItems:"center",gap:6,fontWeight:700,fontSize:13,flexShrink:0,WebkitTapHighlightColor:"transparent",...neonInp(t)}}><Ic n="back" s={20}/><span>{tx.back}</span></button>
          :<button onClick={()=>setSb(true)} style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:11,padding:"9px 11px",cursor:"pointer",color:t.sub,display:"flex",flexShrink:0,...neonInp(t)}}><Ic n="menu" s={20}/></button>}
        <div style={{flex:1,fontSize:16,fontWeight:900,color:t.name==="gold"?"#ffd700":t.name==="multi"?t.acc:t.txt,letterSpacing:-0.3,...neonText(t)}}>
          {page==="home"?<><span>GESTIO</span><span style={{color:t.name==="multi"?t.acc2:t.name==="gold"?"#ffaa00":t.acc,...(t.name==="gold"?{textShadow:"0 0 20px #ffd700, 0 0 60px #ffaa00cc"}:{})}}>PRO</span></>:titles[page]}
        </div>
        {/* User avatar */}
        <button onClick={()=>setProfileOpen(true)} style={{width:36,height:36,borderRadius:18,overflow:"hidden",background:t.inp,border:`2px solid ${t.acc}66`,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",...(t.neon?{boxShadow:`0 0 12px ${t.acc}66`}:{})}}>
          {userPhotoSrc
            ?<img src={userPhotoSrc} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
            :<span style={{fontSize:15,fontWeight:900,color:t.acc}}>{currentUser.name.charAt(0)}</span>}
        </button>
      </div>
      {/* PAGE */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",position:"relative",zIndex:1}}>{PAGES[page]||PAGES.home}</div>
      {/* BOTTOM DOCK */}
      <div style={{background:t.name==="multi"?"linear-gradient(135deg,#08051e,#0d0820)":t.name==="gold"?"#0a0700":t.name==="barca"?"linear-gradient(90deg,#12001a,#06001a,#12001a)":t.card,borderTop:t.name==="multi"?`2px solid ${t.acc2}33`:`1px solid ${t.brd}`,padding:"4px 0 max(6px,env(safe-area-inset-bottom))",display:"flex",overflowX:"auto",flexShrink:0,zIndex:30,WebkitOverflowScrolling:"touch",scrollbarWidth:"none",...(t.neon?{boxShadow:t.name==="gold"?`0 -2px 30px #ffd70044, 0 -4px 60px #ffaa0022`:t.name==="multi"?`0 -2px 16px ${t.acc}33, 0 -2px 16px ${t.acc2}22`:`0 -2px 20px ${t.acc}22`}:{})}}>
        {dock.map(item=>{
          const isAct=page===item.id;
          const barcaC=item.bc||"#a50044";
          const icoCol=t.name==="multi"?(isAct?item.mc:t.sub):t.name==="barca"?(isAct?barcaC:t.sub):isAct?t.acc:t.sub;
          const bgCol=t.name==="multi"?(isAct?item.mc+"33":"transparent"):t.name==="barca"?(isAct?barcaC+"33":"transparent"):isAct?t.acc+"22":"transparent";
          const glowStyle=isAct&&t.neon?{boxShadow:t.name==="multi"?`0 0 14px ${item.mc}88`:t.name==="barca"?`0 0 16px ${barcaC}cc,0 0 40px ${barcaC}66`:`0 0 12px ${t.acc}66`}:{};
          const lblStyle=isAct?(t.name==="multi"?{color:item.mc,textShadow:`0 0 8px ${item.mc}`}:t.name==="barca"?{color:barcaC,textShadow:`0 0 10px ${barcaC}cc`}:neonText(t)):{};
          return(
            <button key={item.id} onClick={()=>nav(item.id)} style={{flex:"0 0 auto",minWidth:58,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"transparent",border:"none",cursor:"pointer",padding:"4px 2px",color:icoCol,WebkitTapHighlightColor:"transparent"}}>
              <div style={{padding:"5px 7px",borderRadius:10,background:bgCol,...glowStyle}}><Ic n={item.icon} s={20}/></div>
              <span style={{fontSize:10,fontWeight:isAct?800:500,...lblStyle}}>{item.label}</span>
            </button>
          );
        })}
      </div>
      <Sidebar open={sb} onClose={()=>setSb(false)} page={page} nav={nav} t={t} lang={lang} currentUser={currentUser}/>
      {/* PROFILE SHEET */}
      <Sheet open={profileOpen} onClose={()=>setProfileOpen(false)} title={tx.myProfile} t={t} lang={lang} full>
        <UserProfileSheet user={currentUser} onUpdate={updateCurrentUser} onClose={()=>setProfileOpen(false)} lang={lang} t={t}/>
        <div style={{borderTop:`1px solid ${t.brd}`,marginTop:16,paddingTop:16}}>
          <Btn onClick={()=>{setCurrentUser(null);setProfileOpen(false);setPage("home");setHist(["home"]);}} danger t={t} full><Ic n="lock" s={16}/>Tancar sessió</Btn>
        </div>
      </Sheet>
      {/* CLIENT SHEET */}
      <Sheet open={cs.open} onClose={()=>setCS({open:false,data:null})} title={cs.data?"Editar client":"Nou client"} t={t} lang={lang} full>
        <ClientForm client={cs.data} onSave={saveClient} onClose={()=>setCS({open:false,data:null})} openVisit={openVisit} openService={()=>setPS({open:true,data:null,type:"service"})} t={t} lang={lang}/>
      </Sheet>
      {/* PRODUCT/SERVICE SHEET */}
      <Sheet open={ps.open} onClose={()=>setPS({open:false,data:null,type:"product"})} title={ps.data?"Editar":ps.type==="product"?"Nou producte":"Nou servei"} t={t} lang={lang} full>
        <ProdForm item={ps.data} type={ps.type} onSave={ps.type==="product"?saveProd:saveSvc} onClose={()=>setPS({open:false,data:null,type:"product"})} t={t} lang={lang} clients={clients}/>
      </Sheet>
      {/* VISIT SHEET */}
      <Sheet open={vs.open} onClose={()=>setVS({open:false,data:null,preClient:null})} title={vs.data?.id?"Editar visita":"Nova visita"} t={t} lang={lang} full>
        <VisitForm visit={vs.data} clients={clients} products={products} services={services} onSave={saveVisit} onClose={()=>setVS({open:false,data:null,preClient:null})} t={t} lang={lang} preClient={vs.preClient}/>
      </Sheet>
      {/* CALENDAR DETAIL */}
      <Sheet open={!!calD} onClose={()=>setCalD(null)} title={calD?.title||"Visita"} t={t} lang={lang}>
        {calD&&(()=>{const c=clients.find(x=>x.id===calD.clientId);return(
          <div>
            <SBadge status={calD.status}/>
            <div style={{margin:"12px 0",fontSize:13,color:t.sub}}>{c?.name} · {fmtD(calD.date)} {calD.time} · {calD.duration}h</div>
            {calD.description&&<div style={{fontSize:13,color:t.txt,marginBottom:12,background:t.inp,borderRadius:10,padding:"10px 12px",...neonInp(t)}}>{calD.description}</div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <Btn onClick={()=>{setVS({open:true,data:calD,preClient:null});setCalD(null);}} outline t={t}><Ic n="edit" s={15}/>Editar</Btn>
              <Btn onClick={()=>{setVisits(vs=>vs.filter(v=>v.id!==calD.id));setCalD(null);}} danger t={t}><Ic n="trash" s={15}/>Eliminar</Btn>
            </div>
            {c&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {c.phone&&<a href={`tel:${c.phone}`} style={{background:t.inp,border:`1px solid ${t.brd}`,borderRadius:12,padding:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:13,color:t.txt,textDecoration:"none",fontWeight:600}}><Ic n="phone" s={15}/>Trucar</a>}
              {c.whatsapp&&<a href={`https://wa.me/34${c.whatsapp}`} target="_blank" rel="noreferrer" style={{background:"#25D36618",borderRadius:12,padding:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:13,color:"#25D366",textDecoration:"none",fontWeight:600}}><Ic n="wa" s={15}/>WhatsApp</a>}
            </div>}
          </div>
        );})()}
      </Sheet>
      <style>{`
        @import url('https:
        *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
        input,select,textarea{-webkit-appearance:none;appearance:none;}
        ::-webkit-scrollbar{width:3px;height:3px;}
        ::-webkit-scrollbar-thumb{background:${t.brd};border-radius:3px;}
        select option{background:${t.card};color:${t.txt};}
        button,a{-webkit-tap-highlight-color:transparent;}
        ${t.neon?`
          ::-webkit-scrollbar-thumb{background:${t.acc}66;}
          ::selection{background:${t.acc}44;}
        `:""}
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(GestioPro));
  </script>
</body>
</html>
