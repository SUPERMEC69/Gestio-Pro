  <script>
    // PWA install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'flex';
    });
    function installApp() {

        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });

    }
